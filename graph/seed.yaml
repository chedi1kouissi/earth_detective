# recipes: unit_native / fill_value / scale_factor from CMR UMM-Var; target unit and conversion
# from the team's reference table (common/variables.py)
variables:
  - dataset: M2TMNXSLV
    name_in_file: T2M
    unit_native: K
    fill_value: 999999986991104
    kind: state
    chart: diverging_trend_map
    concepts:
      surface heating: "Air temperature directly measures how hot the near-surface air is."
      evaporative demand: "Warmer air can hold more water vapour, so it pulls more water from soils and plants."
  - dataset: GPM_3IMERGM
    name_in_file: precipitation
    unit_native: mm/hr
    fill_value: -9999.900390625
    kind: flux
    chart: diverging_trend_map
    concepts:
      water availability: "Rain and snow are the main way water arrives on land."
      water cycle: "Precipitation is the step of the water cycle where water falls back to the ground."
  - dataset: GLDAS_NOAH025_M
    name_in_file: SoilMoi0_10cm_inst
    unit_native: kg m-2
    fill_value: -9999
    scale_factor: 1
    add_offset: 0
    kind: state
    chart: diverging_trend_map
    concepts:
      drought: "Dry soil is the most direct sign of agricultural drought."
      water availability: "Soil moisture is the water that plants can actually use."
  - dataset: GLDAS_NOAH025_M
    name_in_file: Evap_tavg
    unit_native: kg m-2 s-1
    fill_value: -9999
    scale_factor: 1
    add_offset: 0
    kind: flux
    chart: diverging_trend_map
    concepts:
      evaporative demand: "Evapotranspiration is the water actually leaving the land into the air."
      water cycle: "Evapotranspiration returns water from land and plants to the atmosphere."
  - dataset: MOD13C2
    name_in_file: CMG 0.05 Deg Monthly NDVI
    unit_native: NDVI
    fill_value: -3000
    scale_factor: 0.0001
    kind: index
    chart: diverging_trend_map
    concepts:
      vegetation health: "NDVI measures how green and active the plants are."
      drought: "Plants turn brown when the soil stays dry for long periods."

concepts:
  surface heating: [hotter, warmer, warming, heat, temperature, hot]
  water availability: [water, wetter, drier, dry, water scarcity, scarcer, rainfall]
  drought: [droughts, drying, water stress, aridity, arid, dry spell]
  vegetation health: [green, greenness, plants, vegetation, crops, greening, browning]
  evaporative demand: [evaporation, thirsty air, evapotranspiration]
  water cycle: [hydrological cycle, rain, precipitation]

